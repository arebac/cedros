services:
  postgres:
    image: postgres:16-alpine
    container_name: cedros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cedros
      POSTGRES_USER: cedros
      POSTGRES_PASSWORD: cedros_dev_password
    ports:
      - "5433:5432"
    volumes:
      - cedros-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedros -d cedros"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cedros-postgres-data:
