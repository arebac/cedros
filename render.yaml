services:
  - type: web
    name: cedros-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: cedros-db
          property: connectionString
      - key: DATABASE_SSL
        value: true
      - key: TYPEORM_SYNCHRONIZE
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: QB_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: QB_CLIENT_ID
        sync: false
      - key: QB_CLIENT_SECRET
        sync: false
      - key: QB_REDIRECT_URI
        sync: false
      - key: QB_ENVIRONMENT
        value: production

databases:
  - name: cedros-db
    databaseName: cedros
    user: cedros
